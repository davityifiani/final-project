<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Checkout</title>
  <link rel="stylesheet" href="checkout.css">
</head>
<body>

<div class="top">
  <div class="top-inner">
    <p class="top-title">Secure Checkout</p>
    <a href="pricing.html">Continue Browsing</a>
  </div>
</div>

<div class="main">

  <div class="left">
    <img class="error-icon" src="error.svg" alt="">
    <h1>We cant accept online payments</h1>
    <p>Contact us for help with your order.</p>
  </div>

  <div class="right">
    <div class="right-inner">

    <div class="summary-title">
      <h2>Order summary <span>(1 item)</span></h2>
      <a href="cart.html"><img src="pencil.svg" alt="Edit cart"></a>
    </div>

    <div class="item">
      <img class="item-image" src="gift.svg" alt="Gift">
      <div class="item-info">
        <p class="item-name">ENSEMBLE</p>
        <p class="item-duration">Duration: Auto-renew until canceled</p>
      </div>
      <div class="item-price">
        <p class="price">$250.00</p>
        <p class="per">per month</p>
      </div>
    </div>

    <div class="promo">
      <img src="tag.svg" alt="">
      <a href="#">Enter a promo code</a>
    </div>

    <div class="row">
      <p>Subtotal</p>
      <p>$250.00</p>
    </div>

    <div class="row total">
      <p>Total</p>
      <p>$250.00</p>
    </div>

    </div>
  </div>

</div>

<div class="bottom">
  <div class="bottom-inner">
    <p><img src="lock.svg" alt=""> Secure Checkout</p>
  </div>
</div>

</body>
</html>
